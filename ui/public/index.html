<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Sandbox Platform</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #c9d1d9; --accent: #58a6ff; 
      --success: #3fb950; --danger: #f85149; --border: #30363d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background-color: var(--bg); color: var(--text); margin: 0; padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    h1, h3 { margin-top: 0; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px;
    }
    button {
      background: var(--accent); color: #0d1117; border: none; padding: 8px 12px; border-radius: 4px;
      cursor: pointer; font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
    .btn-danger { background: var(--danger); color: white; }
    input[type="text"] {
      width: calc(100% - 130px); padding: 8px; border: 1px solid var(--border); border-radius: 4px;
      background: #0d1117; color: var(--text);
    }
    pre {
      background: #0d1117; padding: 10px; border: 1px solid var(--border); border-radius: 4px;
      overflow-x: auto; color: #8b949e; margin-top: 10px; min-height: 50px;
    }
    .log-entry { font-family: monospace; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .allow { color: var(--success); }
    .deny { color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agent Sandbox Platform</h1>
    
    <div class="card">
      <h3>1. Lifecycle Management</h3>
      <button onclick="createSandbox()">Spin Up Sandbox</button>
      <button onclick="destroySandbox()" class="btn-danger" style="margin-left:10px;">Destroy Active Sandbox</button>
      <p>Active Sandbox ID: <span id="active-id" style="font-family: monospace; color: var(--accent);">None</span></p>
    </div>

    <div class="card">
      <h3>2. Interactive Execution (with Policy Engine)</h3>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="cmd-input" placeholder="Enter command (e.g., ls -la, echo hello, or rm -rf /)" onkeypress="if(event.key === 'Enter') proposeCmd()">
        <button onclick="proposeCmd()">Propose</button>
      </div>
      <div id="approval-section" style="display: none; margin-top: 10px; padding: 10px; border: 1px solid var(--accent); border-radius: 4px;">
        <p><strong>Proposed Command:</strong> <span id="prop-cmd"></span></p>
        <button onclick="approveAndExecute()" class="btn-danger">Approve & Execute</button>
      </div>
      <pre id="output">Output will appear here...</pre>
    </div>

    <div class="card">
      <h3>3. Execution Audit Log</h3>
      <button onclick="fetchAudit()" style="margin-bottom: 10px;">Refresh Logs</button>
      <div id="audit-log" style="max-height: 200px; overflow-y: auto;">
        <!-- Logs populated here -->
      </div>
    </div>
  </div>

  <script>
    let activeContainerId = null;
    let pendingProposal = null;

    async function createSandbox() {
      try {
        const res = await fetch('http://localhost:3000/api/sandbox', { method: 'POST' });
        const data = await res.json();
        activeContainerId = data.containerId;
        document.getElementById('active-id').innerText = activeContainerId;
        alert('Sandbox spun up successfully.');
      } catch (err) {
        alert('Failed to spin up sandbox.');
      }
    }

    async function destroySandbox() {
      if (!activeContainerId) return alert('No active sandbox.');
      try {
        await fetch(`http://localhost:3000/api/sandbox/${activeContainerId}`, { method: 'DELETE' });
        activeContainerId = null;
        document.getElementById('active-id').innerText = 'None';
        alert('Sandbox destroyed.');
      } catch (err) {
        alert('Failed to destroy sandbox.');
      }
    }

    async function proposeCmd() {
      if (!activeContainerId) return alert('Please spin up a sandbox first.');
      const cmd = document.getElementById('cmd-input').value;
      const outputEl = document.getElementById('output');
      outputEl.innerText = 'Proposing...';
      
      try {
        const propRes = await fetch(`http://localhost:3000/api/sandbox/${activeContainerId}/propose`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cmd })
        });
        const propData = await propRes.json();
        
        pendingProposal = { cmd, hash: propData.proposalHash };
        document.getElementById('prop-cmd').innerText = cmd;
        document.getElementById('approval-section').style.display = 'block';
        outputEl.innerText = 'Proposal pending approval...';
      } catch (err) {
        outputEl.innerText = `Error: ${err.message}`;
      }
    }

    async function approveAndExecute() {
      if (!pendingProposal || !activeContainerId) return;
      const { cmd, hash } = pendingProposal;
      const outputEl = document.getElementById('output');
      outputEl.innerText = 'Approving and Executing...';
      
      try {
        // Approve
        await fetch(`http://localhost:3000/api/sandbox/${activeContainerId}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proposalHash: hash, approver: 'ui-admin' })
        });

        // Execute
        const res = await fetch(`http://localhost:3000/api/sandbox/${activeContainerId}/execute`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cmd, proposalHash: hash })
        });
        const data = await res.json();
        
        if (res.ok) {
          outputEl.innerText = data.stdout + (data.stderr ? `\nSTDERR:\n${data.stderr}` : '');
        } else {
          outputEl.innerText = `BLOCKED: ${data.error}`;
        }
        
        document.getElementById('approval-section').style.display = 'none';
        pendingProposal = null;
        fetchAudit();
      } catch (err) {
        outputEl.innerText = `Error: ${err.message}`;
      }
    }

    async function fetchAudit() {
      try {
        const res = await fetch('http://localhost:3000/api/audit');
        const data = await res.json();
        const escapeHTML = (str) => str ? str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
          }[tag])) : '';

        const logHtml = data.logs.reverse().map(l => {
          const status = l.allowed ? '<span class="allow">[ALLOW]</span>' : '<span class="deny">[DENY]</span>';
          return `<div class="log-entry">${new Date(l.timestamp).toLocaleTimeString()} ${status} ${escapeHTML(l.cmd)} 
            ${l.error ? `- ${escapeHTML(l.error)}` : ''}</div>`;
        }).join('');
        document.getElementById('audit-log').innerHTML = logHtml;
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
